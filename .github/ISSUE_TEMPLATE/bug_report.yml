name: Bug report
description: 报告一个可以在 ReadDock 中复现的问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        请不要提交账号、Cookie、私钥、个人文件或未授权漫画内容。
  - type: input
    id: version
    attributes:
      label: ReadDock 版本
      placeholder: 0.5.0-beta01
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 如何复现
      description: 请写出别人可以照着操作的最小步骤。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 实际表现和预期表现
    validations:
      required: true
